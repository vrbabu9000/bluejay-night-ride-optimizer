<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="753" viewBox="0 0 1000 753" style="max-width:100%;height:auto" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Data flow and files</title>
  <desc id="desc">Four swimlanes, left to right: Evidence, World, Simulation, Communication. The April PDF is digitized into observations and map clusters, which feed the insight figures and, via zones and OSRM travel times, the scenario generator. Scenario files feed the runner, whose outputs feed the replay viewer and the experiment figures.</desc>
  <rect x="0" y="0" width="1000" height="753" fill="#FFFFFF"/>
  <!-- swimlanes -->
  <g id="p4-lane-evidence">
    <rect x="8" y="10" width="234" height="733" rx="8" ry="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="125" y="27.18" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Evidence</text>
  </g>
  <g id="p4-lane-world">
    <rect x="258" y="10" width="234" height="733" rx="8" ry="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="375" y="27.18" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">World</text>
  </g>
  <g id="p4-lane-simulation">
    <rect x="508" y="10" width="234" height="733" rx="8" ry="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="625" y="27.18" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Simulation</text>
  </g>
  <g id="p4-lane-communication">
    <rect x="758" y="10" width="234" height="733" rx="8" ry="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="875" y="27.18" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Communication</text>
  </g>
  <!-- nodes -->
  <g id="p4-april-pdf">
    <rect x="20" y="58" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="125" y="80.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">April PDF</text>
    <text x="125" y="95.345" font-size="11" fill="#444441" text-anchor="middle">12 charts on 11 pages</text>
  </g>
  <g id="p4-page-images">
    <rect x="20" y="136" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="125" y="158.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Page images</text>
    <text x="125" y="173.345" font-size="11" fill="#444441" text-anchor="middle">data/raw/april/pNN.png</text>
  </g>
  <g id="p4-digitizers">
    <rect x="20" y="214" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="125" y="236.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Digitizers</text>
    <text x="125" y="251.345" font-size="11" fill="#444441" text-anchor="middle">src/evidence</text>
  </g>
  <g id="p4-digitized">
    <rect x="20" y="292" width="210" height="82" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="125" y="314.605" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Digitized data</text>
    <text x="125" y="329.135" font-size="11" fill="#444441" text-anchor="middle">data/processed/observations.csv</text>
    <text x="125" y="344.345" font-size="11" fill="#444441" text-anchor="middle">data/processed/map_clusters.csv</text>
    <text x="125" y="359.555" font-size="11" fill="#444441" text-anchor="middle">+ briefs in docs/evidence</text>
  </g>
  <g id="p4-insights">
    <rect x="20" y="401" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="125" y="423.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Insights T1–T10</text>
    <text x="125" y="438.345" font-size="11" fill="#444441" text-anchor="middle">src/insights</text>
  </g>
  <g id="p4-insight-figs">
    <rect x="20" y="495" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
