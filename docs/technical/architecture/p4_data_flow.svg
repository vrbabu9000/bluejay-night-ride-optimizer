    <polygon points="625,487 621.5,479.5 628.5,479.5" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
  <g id="p4-e-runner-outputs">
    <polyline points="625,555 625,573.5" fill="none" stroke="#5F5E5A" stroke-width="1"/>
    <polygon points="625,581 621.5,573.5 628.5,573.5" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0.5" stroke-linejoin="round"/>
