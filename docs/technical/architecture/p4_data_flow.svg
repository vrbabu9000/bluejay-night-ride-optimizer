    <text x="375" y="336.74" font-size="11" fill="#444441" text-anchor="middle">src/scenario</text>
    <text x="375" y="351.95" font-size="11" fill="#444441" text-anchor="middle">Travel-time matrix, cached routes</text>
  </g>
  <g id="p4-generator">
    <rect x="270" y="393" width="210" height="68" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="375" y="416.21" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Scenario generator</text>
    <text x="375" y="430.74" font-size="11" fill="#444441" text-anchor="middle">src/scenario</text>
    <text x="375" y="445.95" font-size="11" fill="#444441" text-anchor="middle">Gravity + IPF, then sampling</text>
  </g>
  <g id="p4-scenario-files">
    <rect x="270" y="495" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="375" y="517.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Scenario files</text>
    <text x="375" y="532.345" font-size="11" fill="#444441" text-anchor="middle">requests_*.csv, fleet_*.csv</text>
  </g>
  <g id="p4-dispatchers">
    <rect x="520" y="393" width="210" height="68" rx="8" ry="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="625" y="416.21" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Dispatchers</text>
    <text x="625" y="430.74" font-size="11" fill="#3C3489" text-anchor="middle">src/sim/dispatchers</text>
    <text x="625" y="445.95" font-size="11" fill="#3C3489" text-anchor="middle">N, A, B, C, H</text>
  </g>
  <g id="p4-runner">
    <rect x="520" y="487" width="210" height="68" rx="8" ry="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="625" y="510.21" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Runner + engine</text>
    <text x="625" y="524.74" font-size="11" fill="#085041" text-anchor="middle">src/sim</text>
    <text x="625" y="539.95" font-size="11" fill="#085041" text-anchor="middle">Scenarios × players × seeds</text>
  </g>
  <g id="p4-outputs">
    <rect x="520" y="581" width="210" height="68" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="625" y="604.21" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Run outputs</text>
    <text x="625" y="618.74" font-size="11" fill="#444441" text-anchor="middle">replay.json, request_results,</text>
    <text x="625" y="633.95" font-size="11" fill="#444441" text-anchor="middle">run_manifest.json</text>
  </g>
  <g id="p4-viewer">
    <rect x="770" y="589" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="875" y="611.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Replay viewer</text>
    <text x="875" y="626.345" font-size="11" fill="#444441" text-anchor="middle">src/viewer</text>
  </g>
  <g id="p4-exp-figs">
    <rect x="770" y="667" width="210" height="52" rx="8" ry="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="875" y="689.815" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Experiment figures</text>
    <text x="875" y="704.345" font-size="11" fill="#444441" text-anchor="middle">Value ladder, heat map</text>
  </g>
  <!-- arrows -->
  <g id="p4-e-pdf-images">
    <polyline points="125,110 125,128.5" fill="none" stroke="#5F5E5A" stroke-width="1"/>
    <polygon points="125,136 121.5,128.5 128.5,128.5" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
